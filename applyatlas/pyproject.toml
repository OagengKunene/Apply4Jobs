[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "applyatlas"
version = "0.1.0"
description = "Evidence-grounded, policy-controlled job application agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "httpx>=0.28,<1", "cryptography>=44,<49", "beautifulsoup4>=4.12,<5",
  "langgraph==1.2.19", "langgraph-checkpoint-sqlite==3.1.3",
  "playwright>=1.50,<2", "reportlab>=4.2,<5", "python-dotenv>=1,<2", "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pypdf>=5,<7"]
jobspy = ["python-jobspy>=1.1,<2"]

[project.scripts]
applyatlas = "applyatlas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/applyatlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
