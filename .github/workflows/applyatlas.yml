name: ApplyAtlas checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: applyatlas/pyproject.toml
      - run: pip install -e './applyatlas[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: ruff check applyatlas
      - run: python -m pytest -q applyatlas/tests --junitxml=test-results/results.xml
        env:
          APPLYATLAS_CAPTURE_DOCS: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: applyatlas-validation
          path: |
            test-results/results.xml
            applyatlas/docs/workspace.png
            applyatlas/docs/mobile.png
